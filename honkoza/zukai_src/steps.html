<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--teal:#0E7C86;--deep:#0A5A62;--ink:#1C3236;--ink2:#4A6468;--soft:#EEF6F7;--line:#D5E4E6;--gold:#A87A1F;--goldfill:#D9A441;--goldbg:#FBF4E3;--green:#06C755}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1350px;font-family:"Zen Maru Gothic",sans-serif;color:var(--ink);background:#FBFDFD;background-image:radial-gradient(#D5E4E6 2px,transparent 2px);background-size:28px 28px;position:relative;overflow:hidden}
.wrap{position:absolute;inset:44px;background:#fff;border-radius:44px;box-shadow:0 10px 40px rgba(10,90,98,.10);padding:56px 60px}
.tag{display:inline-block;background:var(--teal);color:#fff;font-weight:900;font-size:28px;border-radius:999px;padding:8px 26px;letter-spacing:.04em}
h1{font-size:64px;font-weight:900;line-height:1.35;margin:26px 0 14px;color:var(--deep)}
h1 .mk{background:linear-gradient(transparent 58%,#F6E3A8 58%);color:var(--ink)}
.lead{font-size:30px;font-weight:700;color:var(--ink2);line-height:1.6;margin-bottom:30px}
.lead b{color:#C2410C}
.steps{display:grid;gap:18px}
.st{display:grid;grid-template-columns:84px 1fr;gap:22px;align-items:center;border:3px solid var(--line);border-radius:28px;padding:20px 26px;background:#fff;position:relative}
.st .n{width:84px;height:84px;border-radius:50%;background:var(--teal);color:#fff;font-weight:900;font-size:44px;display:flex;align-items:center;justify-content:center}
.st h2{font-size:38px;font-weight:900;line-height:1.35}
.st p{font-size:28px;font-weight:700;color:var(--ink2);line-height:1.5;margin-top:4px}
.st.hl{border:4px solid var(--goldfill);background:var(--goldbg)}
.st.hl .n{background:var(--goldfill);color:var(--ink)}
.badge{position:absolute;right:22px;top:-20px;background:#C2410C;color:#fff;font-weight:900;font-size:24px;border-radius:999px;padding:4px 18px}
.st.goal .n{background:var(--deep)}
.arrow{height:0}
.robo{position:absolute;right:64px;top:64px;width:180px}
.foot{position:absolute;left:60px;bottom:66px;background:var(--ink);color:#fff;font-weight:900;font-size:26px;border-radius:999px;padding:12px 30px}
</style></head><body><div class="wrap">
<span class="tag">金融AIカレッジ 本講座2期</span>
<h1>お申込みまでは<br><span class="mk">4つの手順</span>です</h1>
<p class="lead">審査を送っただけでは、<b>まだお申込みは終わっていません。</b></p>
<div class="steps">
 <div class="st"><div class="n">1</div><div><h2>参加審査を送る</h2><p>無料・1分。送っても、受講の義務はありません。</p></div></div>
 <div class="st hl"><span class="badge">ここでお申込み完了</span><div class="n">2</div><div><h2>申込ページで「注文を確定する」</h2><p>コースと金額を確かめて押します。審査の結果を待つ必要はありません。</p></div></div>
 <div class="st"><div class="n">3</div><div><h2>お支払い</h2><p>銀行振込（7日以内）。カード払いの方には専用ページをお送りします。</p></div></div>
 <div class="st goal"><div class="n">4</div><div><h2>1月14日（木）20:00 開講</h2><p>入金を確認したら、事前の準備をお送りします。</p></div></div>
</div>
<span class="foot">迷ったら、LINEかメールで「いまどこ？」と一言</span>
<img class="robo" src="mascot_point.webp" alt="">
</div></body></html>
