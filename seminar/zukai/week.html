<meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#F7F3EA;--surface:#FFFFFF;--ink:#22293A;--ink-soft:#4F586B;--accent:#C9A227;--accent-d:#A9771B;--accent-soft:#F5E9C8;--line:#E3DCCB}
html,body{width:1080px}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);padding:60px 52px;display:flex;flex-direction:column;font-feature-settings:"palt";line-height:1.4;letter-spacing:.02em}
.kicker{font-size:30px;font-weight:700;color:var(--accent-d);letter-spacing:.18em;margin-bottom:12px}
h1{font-size:72px;font-weight:800;line-height:1.28;margin-bottom:12px}
h1 .em{color:var(--accent-d)}
.lead{font-size:38px;color:var(--ink-soft);margin-bottom:24px;font-weight:600}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:22px 24px}
.footer{margin-top:auto;padding-top:20px;border-top:1.5px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:30px;color:var(--ink-soft);font-weight:600}
</style><style>body{height:1180px}
.top{display:grid;grid-template-columns:1fr 260px;gap:16px;align-items:center;margin-bottom:18px}
.top img{width:260px;height:260px;object-fit:cover;border-radius:22px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.col .h{font-size:40px;font-weight:800;color:var(--accent-d);margin-bottom:8px}
.col .h span{font-size:28px;color:var(--ink-soft);font-weight:700;margin-left:8px}
.row{display:grid;grid-template-columns:104px 1fr;gap:10px;align-items:center;padding:12px 0;border-top:1.5px dashed var(--line);font-size:46px;font-weight:700;line-height:1.2;white-space:nowrap}
.row:first-of-type{border-top:0}
.row .d{font-size:26px;font-weight:800;color:var(--ink-soft);background:var(--accent-soft);border-radius:999px;padding:8px 0;text-align:center}
</style>
<div class="top"><div><div class="kicker">FIRST WEEK</div><h1>右腕と左腕の、<br><span class="em">最初の1週間</span></h1><p class="lead" style="margin:0">貼るだけで、こう動き出す</p></div><img src="src/man_two_ai.png" alt=""></div>
<div class="cols">
 <div class="card col"><div class="h">右腕<span>集客</span></div>
  <div class="row"><div class="d">1日目</div><div>設定文を貼る</div></div>
  <div class="row"><div class="d">2日目</div><div>理由が3つ出る</div></div>
  <div class="row"><div class="d">3日目</div><div>ネタと下書き</div></div>
  <div class="row"><div class="d">4日目</div><div>診断ページ完成</div></div>
  <div class="row"><div class="d">5日目</div><div>LINEの応答</div></div>
  <div class="row"><div class="d">6〜7</div><div>公開を決める</div></div>
 </div>
 <div class="card col"><div class="h">左腕<span>面談・提案</span></div>
  <div class="row"><div class="d">1日目</div><div>設定文を貼る</div></div>
  <div class="row"><div class="d">2日目</div><div>メモ→骨子</div></div>
  <div class="row"><div class="d">3日目</div><div>フォロー文</div></div>
  <div class="row"><div class="d">4日目</div><div>直し方を覚える</div></div>
  <div class="row"><div class="d">5日目</div><div>本番で使う</div></div>
  <div class="row"><div class="d">6〜7</div><div>3か月後の連絡</div></div>
 </div>
</div>
<div class="footer"><span>すべて「作るまで」の手順</span><span>出すかは、本人と会社</span></div>
